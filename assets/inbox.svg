  <line x1="20" y1="270" x2="900" y2="270" class="rule"/>
  <text x="20" y="294"><tspan class="b">acme/api-server#212</tspan>  <tspan class="dim">by a-teammate</tspan><tspan class="dim">  ·  found by the watcher</tspan>   <tspan class="grn">up to date</tspan></text>
  <text x="20" y="320" class="blu">What this PR does</text>
  <text x="20" y="340">Logging out clears the session cookie, but the refresh token stays valid for 30 days.</text>
  <text x="20" y="366"><tspan class="b">Blocking:</tspan> <tspan class="cya">revokeRefreshToken()</tspan> is never called from <tspan class="cya">logout()</tspan>, so a stolen token</text>
  <text x="20" y="386">keeps working after the user logs out.  <tspan class="dim">(auth/session.ts:84, suggestion included)</tspan></text>

  <line x1="20" y1="402" x2="900" y2="402" class="rule"/>
  <text x="20" y="424"><tspan class="cya b2">↑↓</tspan> <tspan class="dim">move</tspan>   <tspan class="cya b2">⏎</tspan> <tspan class="dim">open</tspan>   <tspan class="cya b2">p</tspan> <tspan class="dim">post</tspan>   <tspan class="cya b2">d</tspan> <tspan class="dim">discard</tspan>   <tspan class="cya b2">o</tspan> <tspan class="dim">browser</tspan>   <tspan class="cya b2">n</tspan> <tspan class="dim">review a link</tspan>   <tspan class="cya b2">tab</tspan> <tspan class="dim">next tab</tspan>   <tspan class="cya b2">u</tspan> <tspan class="dim">update</tspan>   <tspan class="cya b2">q</tspan> <tspan class="dim">quit</tspan></text>
