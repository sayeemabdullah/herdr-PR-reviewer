  <rect x="16" y="180" width="888" height="24" rx="4" fill="#161b22"/>
  <text x="22" y="197" class="cya">▸</text>
  <rect x="40" y="184" width="72" height="17" rx="3" fill="#f85149"/><text x="76" y="197" text-anchor="middle" class="badge">CHANGES</text>
  <text x="124" y="197"><tspan>api-server</tspan>   <tspan class="dim">#212</tspan>   <tspan class="b">fix(auth): refresh tokens are not revoked on logout</tspan></text>
  <text x="900" y="197" text-anchor="end"><tspan class="dim">auto</tspan><tspan class="dim">   5 notes   31m</tspan></text>

  <rect x="40" y="210" width="72" height="17" rx="3" fill="#e3b341"/><text x="76" y="223" text-anchor="middle" class="badge">COMMENT</text>
  <text x="124" y="223"><tspan>web-app</tspan>      <tspan class="dim">#415</tspan>   feat(settings): let users export their data as CSV</text>
  <text x="900" y="223" text-anchor="end"><tspan class="cya b2">link</tspan><tspan class="dim">   3 notes   12m</tspan></text>

