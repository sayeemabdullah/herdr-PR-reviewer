  <rect x="0.5" y="22" width="919" height="13" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="460" y="22" text-anchor="middle" class="dim">pr-panel</text>
  <line x1="0" y1="35" x2="920" y2="35" class="rule"/>

  <rect x="16" y="48" width="78" height="20" rx="3" fill="#f0f6fc"/><text x="55" y="62" text-anchor="middle" class="badge">PR Panel</text><rect x="100" y="48" width="90" height="20" rx="3" fill="#39c5cf"/><text x="145" y="62" text-anchor="middle" class="badge">Inbox 3 ⟳2</text><text x="202" y="62" class="dim">│</text><text x="220" y="62"><tspan class="b">Repos</tspan> <tspan class="dim">2</tspan></text><text x="293" y="62" class="dim">│</text><text x="311" y="62"><tspan class="b">Settings</tspan></text><text x="391" y="62" class="dim">│</text><text x="409" y="62"><tspan class="b">History</tspan> <tspan class="dim">12</tspan></text><text x="505" y="62" class="dim">│</text><text x="523" y="62"><tspan class="b">Update</tspan> <tspan class="yel">↑0.8.0</tspan></text>
  <text x="900" y="62" text-anchor="end"><tspan class="grn">● watching</tspan></text>
  <line x1="20" y1="76" x2="900" y2="76" class="rule"/>

