id = "pr-reviewer"
name = "PR Reviewer"
version = "0.3.0"
min_herdr_version = "0.8.0"
description = "Watch GitHub repos and have your AI (Claude Code, Codex, Gemini CLI, Cursor or opencode) review incoming PRs, with an optional human final word"
platforms = ["macos", "linux"]

# Opens the watcher tab when the herdr server starts (if autoStartWatcher is on).
[[startup]]
command = ["node", "src/startup.js"]

[[actions]]
id = "watch"
title = "PR Reviewer: start / focus watcher"
command = ["node", "src/open-pane.js", "watcher"]

[[actions]]
id = "panel"
title = "PR Reviewer: open PR Panel (inbox, repos, settings)"
command = ["node", "src/open-pane.js", "panel"]

# The old name of "panel", kept so existing shortcuts (pr-reviewer.inbox) keep working.
[[actions]]
id = "inbox"
title = "PR Reviewer: open PR Panel (old shortcut name)"
command = ["node", "src/open-pane.js", "panel"]

# Adds a `pr-panel` command (~/.local/bin) that opens the panel in any terminal, and survives updates.
[[actions]]
id = "install-cli"
title = "PR Reviewer: install the pr-panel command"
command = ["node", "src/install-cli.js"]

# Long-running poll loop; lives in its own tab so you can see what it's doing.
[[panes]]
id = "watcher"
title = "PR watcher"
placement = "tab"
command = ["node", "src/watcher.js"]

# PR Panel: the inbox (approve / edit / discard AI reviews), repos, settings and history.
[[panes]]
id = "panel"
title = "PR Panel"
placement = "overlay"
command = ["node", "src/panel.js"]
